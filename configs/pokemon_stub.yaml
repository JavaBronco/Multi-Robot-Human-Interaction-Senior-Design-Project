# Smoke-test config: proves the same core trains the (placeholder) Pokémon app.
app: apps.pokemon_stub
run_name: pokemon_stub
seed: 1
device: auto
total_timesteps: 40960
num_envs: 8
log_interval: 5
checkpoint_every: 20
track_wandb: false

env:
  max_turns: 100

encoder:
  hidden: 64

policy:
  hidden_sizes: [64, 64]

ppo:
  num_steps: 128
  learning_rate: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 4
  update_epochs: 4
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

selfplay:
  snapshot_every: 10   # freeze the policy into the opponent pool every N updates
  max_snapshots: 5

eval:
  episodes: 200
