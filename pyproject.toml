[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrhi"
version = "0.1.0"
description = "Shared masked-PPO decision-maker for the robot navigation and Pokémon battle apps."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "gymnasium>=1.1",
    "pettingzoo>=1.24",
    "pyyaml>=6.0",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["core*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
